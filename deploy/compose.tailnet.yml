# Override for a private server behind Tailscale Serve (for example fx553vd-de).
# Tailscale terminates HTTPS with the tailnet certificate and proxies to Caddy,
# so Caddy listens on loopback only and serves plain HTTP. Caddy remains the only
# service with a host port; API and web stay on the internal Compose network.
# Enable it with COMPOSE_FILE=docker-compose.yml:deploy/compose.tailnet.yml in .env
# and set DOMAIN=:80. `!override` needs Docker Compose 2.24 or newer.
services:
  caddy:
    ports: !override
      - "127.0.0.1:${BN_HTTP_PORT:-8090}:80"
