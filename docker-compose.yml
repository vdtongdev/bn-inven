services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - bn_data:/data
    environment:
      DATABASE_URL: sqlite:////data/bn-inven.db
      STORAGE_PATH: /data/uploads
    expose: ["8000"]
    restart: unless-stopped
  worker:
    build: ./backend
    command: python -m app.workers.extraction
    env_file: .env
    volumes:
      - bn_data:/data
    environment:
      DATABASE_URL: sqlite:////data/bn-inven.db
      STORAGE_PATH: /data/uploads
    depends_on: [api]
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    expose: ["80"]
    depends_on: [api]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    restart: unless-stopped
volumes:
  bn_data:
  caddy_data:
  caddy_config:
