[project]
name = "bn-inven-api"
version = "0.1.0"
description = "Product catalog digitization API for BN-Inven"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.41",
  "alembic==1.16.1",
  "pydantic-settings==2.9.1",
  "pillow==11.2.1",
  "openpyxl==3.1.5",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
